[package]
name = "sha3-circuit"
authors = ["Alexandros Zacharakis"]
version = "0.1.0"
edition = "2021"
description = "Lookup based midnight-proofs (halo2 fork) implementation of keccak-f[1600] permutation and gadgets for the sha3-256 and keccak-256 hash functions."
readme = "README.md"
license = "Apache-2.0"
categories = ["cryptography"]
keywords = ["halo", "proofs", "zkp", "zkSNARKs", "sha3", "keccak"]

[[bin]]
name = "haloumi-extractor"
required-features = ["extraction"]
path = "src/bin/extractor.rs"

[dependencies]
midnight-proofs = { path = "../midnight-zk-current/proofs/" }
# midnight-proofs = { git = "https://github.com/Veridise/midnight-zk", version = "0.5.1", default-features = false, features = [
#   # "bits",
#   # "cost-estimator",
#   "circuit-params",
# ] }
num-bigint = { version = "0.4" }
rand = "0.8"
blake2b_simd = "1.0.3"
ff = "0.13"
midnight-curves = { path = "../midnight-zk-current/curves", optional = true }

# extraction deps 
haloumi = { path = "../haloumi/integration", package = "haloumi-integration", optional = true }
haloumi-extractor = { path = "../haloumi/extractor",  optional = true }
mdnt-support = { path = "../midnight-extractor/crates/support/", optional = true }
picus = { path = "../midnight-extractor/crates/support-macros/", package = "mdnt-support-macros" }
mdnt-groups-support = { path = "../midnight-extractor/crates/groups-support/" }

[dev-dependencies]
criterion = "0.3"
rand_chacha = "0.3.1"
sha3 = "0.10.0"
halo2curves = "0.9"

[[bench]]
name = "sha3_preimage"
harness = false

[features]
default = ["extraction"] # Default while writing the extraction support
extraction = [
  "mdnt-support",
  "haloumi",
  "haloumi-extractor",
  "picus/extractor-derive",
  "midnight-proofs/extraction", 
  "midnight-proofs/region-groups"
  ,"midnight-curves"
]
